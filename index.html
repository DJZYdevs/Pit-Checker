<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pit Checker</title>
<!--
  Pit Checker — Changelog
  v0.1  Initial prototype: single pit, top view, pipe fit / corner clearance check
  v0.2  Multi-pit projects, IndexedDB persistence, pipe reorder, auto-centred spacing
  v0.3  Collapsible pipe cards, cross-section pipe circles, dimension lines, flow arrows,
        label size control, click-to-filter selection
  v0.4  Versioning + in-file changelog, multi-pipe groups per wall (equal size/skew for now),
        group centring from wall centre with manual override, pinch/scroll zoom with
        screen-constant dynamic label sizing, plan-view pipe symbol (no circles in top view),
        TOP VIEW title, outlet label clipping fix
  v0.5  North-arrow overlay (top-left, screen-fixed) replacing cluttered N/E/S/W text labels;
        dashed diagonal setout cross for closed-cover pits; pipe spacing now measured
        edge-to-edge (outer diameter to outer diameter) instead of centre-to-centre; top view
        simplified to outer diameter only (no inner diameter line); pipes now extend to the
        pit's inner wall and 500mm outside the pit for clearer skew/corner checking; pit cover
        type (closed / grated) with default 600x600 grate, auto-haunched if the pit is larger
-->
<style>
  :root{
    --paper:#EEF2F1; --grid:#DCE4E2; --ink:#16232E;
    --wall:#16232E; --wall-fill:#C7D0CC; --pipe:#4C7A92; --pipe-fail:#B54834;
    --pass:#3C7A5C; --fail:#B54834; --panel-bg:#FFFFFF; --accent:#C77A34; --line-muted:#5C6B67;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; background:var(--paper); color:var(--ink);
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; overflow-x:hidden; width:100%; }
  body{ background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size:28px 28px; }
  .app{ display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }
  header{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; background:var(--ink); color:#EEF2F1; flex-wrap:wrap; }
  header .title{ font-size:15px; letter-spacing:0.02em; min-width:0; }
  header .title span{ display:block; font-size:11px; color:#9DB0A8; margin-top:2px; }
  #toggleBtn{ background:transparent; border:1px solid #4C5B54; color:#EEF2F1; padding:7px 12px; border-radius:3px; font-size:12.5px; cursor:pointer; }
  #toggleBtn:hover{ background:#243141; }
  .body-row{ display:flex; flex:1; min-height:0; width:100%; position:relative; }
  .panel{ width:320px; max-width:85vw; flex-shrink:0; background:var(--panel-bg); border-right:1px solid var(--grid);
    padding:16px; overflow-y:auto; max-height:calc(100vh - 54px); max-height:calc(100dvh - 54px);
    transition:margin-left 0.18s ease, opacity 0.18s ease; }
  .panel.hidden{ margin-left:-320px; opacity:0; pointer-events:none; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11px; color:var(--line-muted); margin-bottom:4px; }
  .field input, .field select{ width:100%; padding:8px; border:1px solid #C7D0CC; border-radius:3px; font-size:16px; background:#FBFCFB; color:var(--ink); }
  .field-row{ display:flex; gap:8px; }
  .field-row .field{ flex:1; }
  .checkbox-row{ display:flex; align-items:center; gap:7px; font-size:12.5px; margin:6px 0 10px; }
  .checkbox-row input{ width:auto; }
  .section-label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink);
    border-bottom:2px solid var(--ink); padding-bottom:5px; margin:18px 0 12px; display:flex; justify-content:space-between; align-items:center; }
  .section-label:first-child{ margin-top:0; }
  .pit-item{ display:flex; align-items:center; justify-content:space-between; gap:6px; padding:8px 9px; border:1px solid var(--grid);
    border-radius:4px; margin-bottom:6px; background:#F7F9F8; cursor:pointer; font-size:12.5px; }
  .pit-item.active{ border-color:var(--ink); background:#E9EDEC; font-weight:700; }
  .pit-item .pit-actions{ display:flex; gap:4px; flex-shrink:0; }
  .icon-btn{ background:none; border:none; cursor:pointer; font-size:13px; padding:2px 5px; color:var(--line-muted); }
  .icon-btn:hover{ color:var(--ink); }
  .icon-btn.danger:hover{ color:var(--fail); }
  .icon-btn:disabled{ opacity:0.3; cursor:default; }
  .add-btn{ width:100%; padding:9px; background:var(--ink); color:#EEF2F1; border:none; border-radius:3px; font-size:12.5px; cursor:pointer; margin-top:4px; }
  .add-btn:hover{ background:#243141; }
  .filter-chip{ display:flex; align-items:center; justify-content:space-between; background:#FCEFDF; border:1px solid #E9C99A;
    color:#8A5A1E; padding:7px 10px; border-radius:4px; font-size:12px; margin-bottom:10px; }
  .filter-chip button{ background:none; border:none; color:#8A5A1E; font-weight:700; cursor:pointer; font-size:12px; }
  .pipe-card{ border:1px solid var(--grid); border-radius:4px; margin-bottom:10px; background:#F7F9F8; overflow:hidden; }
  .pipe-card .pipe-head{ display:flex; justify-content:space-between; align-items:center; gap:6px; padding:10px; cursor:pointer; }
  .pipe-card .pipe-head .htext{ display:flex; align-items:center; gap:6px; flex:1; min-width:0; }
  .pipe-card .pipe-head .chevron{ flex-shrink:0; font-size:10px; color:var(--line-muted); }
  .pipe-card .pipe-head b{ font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pipe-card .pipe-head .meta{ font-size:10.5px; color:var(--line-muted); flex-shrink:0; }
  .pipe-card .pipe-body{ padding:0 10px 10px; }
  .pipe-card .subnote{ font-size:11px; color:var(--line-muted); margin:2px 0 10px; }
  .reorder-btns{ display:flex; gap:2px; flex-shrink:0; }
  .remove-btn{ background:none; border:none; color:var(--fail); font-size:12px; cursor:pointer; padding:2px 6px; flex-shrink:0; }
  .auto-offset-display{ font-size:12px; color:var(--line-muted); padding:8px; background:#EFF2F1; border-radius:3px; border:1px dashed #C7D0CC; margin-bottom:10px; }
  .canvas-wrap{ flex:1; min-width:0; display:flex; flex-direction:column; padding:18px; }
  .canvas-toolbar{ display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:8px; }
  .view-title{ font-size:12px; font-weight:700; letter-spacing:0.08em; color:var(--ink); }
  .zoom-controls{ display:flex; gap:6px; }
  .canvas-toolbar button{ background:#fff; border:1px solid var(--grid); border-radius:3px; width:28px; height:28px; font-size:14px; cursor:pointer; color:var(--ink); }
  .canvas-toolbar button:hover{ background:var(--paper); }
  .status-banner{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:4px; font-size:13px; margin-bottom:14px; font-weight:600; }
  .status-banner.pass{ background:#E4F0E8; color:var(--pass); border:1px solid #BEDBC8; }
  .status-banner.fail{ background:#F5E5DF; color:var(--fail); border:1px solid #E5BEAF; }
  .status-dot{ width:9px; height:9px; border-radius:50%; background:currentColor; flex-shrink:0; }
  .svg-frame{ flex:1; min-height:400px; background:#FBFCFB; border:1px solid var(--grid); border-radius:4px; display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; position:relative; }
  svg{ width:100%; height:100%; }
  .north-arrow{ position:absolute; top:10px; left:10px; width:clamp(30px,8vw,46px); height:clamp(30px,8vw,46px); z-index:2; pointer-events:none; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.15)); }
  .issue-list{ margin-top:12px; font-size:12.5px; }
  .issue-list .issue{ padding:7px 10px; border-left:3px solid var(--fail); background:#F5E5DF; margin-bottom:6px; border-radius:0 3px 3px 0; color:#7A3521; }
  .save-note{ font-size:10.5px; color:var(--line-muted); text-align:center; margin-top:14px; }
  @media (max-width: 760px){
    .panel{ position:fixed; z-index:5; top:0; left:0; bottom:0; width:85vw; max-width:320px; max-height:none; padding-top:66px; box-shadow:2px 0 12px rgba(0,0,0,0.15); }
    .panel.hidden{ margin-left:-85vw; }
    .canvas-wrap{ padding:12px; }
    .svg-frame{ min-height:280px; }
    header{ padding:10px 12px; }
    header .title span{ font-size:10.5px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title"><b>Pit Checker</b><span id="versionLabel">v0.5 · Top view · pipe fit &amp; clearance</span></div>
    <button id="toggleBtn">Hide inputs</button>
  </header>
  <div class="body-row">
    <div class="panel" id="panel">
      <div class="section-label">Project</div>
      <div class="field">
        <label>Project name</label>
        <input id="projectName" type="text" value="Project 01">
      </div>
      <div id="pitList"></div>
      <button class="add-btn" id="addPitBtn">+ Add pit</button>

      <div class="section-label">Pit settings</div>
      <div class="field">
        <label>Pit name</label>
        <input id="pitName" type="text">
      </div>
      <div class="field-row">
        <div class="field"><label>Internal width (mm) — E/W</label><input id="pitWidth" type="number" step="10"></div>
        <div class="field"><label>Internal length (mm) — N/S</label><input id="pitLength" type="number" step="10"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Wall thickness (mm)</label><input id="wallThk" type="number" step="5"></div>
        <div class="field"><label>Min corner clearance (mm)</label><input id="cornerClear" type="number" step="10"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Default clear spacing between pipes (mm)</label><input id="pipeSpacing" type="number" step="10"></div>
        <div class="field"><label>Default pipe wall thk (mm)</label><input id="defaultPipeWT" type="number" step="1"></div>
      </div>
      <div class="subnote">Default spacing is a placeholder — confirm the exact figure against the current VicRoads/DTP standard drawing for your project before relying on it.</div>

      <div class="field">
        <label>Pit cover</label>
        <select id="coverType">
          <option value="closed">Closed cover</option>
          <option value="grated">Grated (open) cover</option>
        </select>
      </div>
      <div class="field-row" id="grateFields">
        <div class="field"><label>Grate width (mm)</label><input id="grateW" type="number" step="10"></div>
        <div class="field"><label>Grate length (mm)</label><input id="grateH" type="number" step="10"></div>
      </div>

      <div class="section-label">Pipes <span id="pipeCountLabel" style="font-weight:400;font-size:11px;"></span></div>
      <div id="filterChipWrap"></div>
      <div id="pipeList"></div>
      <button class="add-btn" id="addPipeBtn">+ Add pipe</button>
      <div class="save-note" id="saveNote">Saved locally in this browser</div>
    </div>

    <div class="canvas-wrap">
      <div class="status-banner" id="statusBanner"></div>
      <div class="canvas-toolbar">
        <span class="view-title">TOP VIEW</span>
        <span class="zoom-controls">
          <button id="zoomOut" title="Zoom out">−</button>
          <button id="zoomReset" title="Reset view">⤢</button>
          <button id="zoomIn" title="Zoom in">+</button>
        </span>
      </div>
      <div class="svg-frame" id="svgFrame">
        <svg id="pitSvg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet"></svg>
        <svg class="north-arrow" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="18" fill="#FBFCFB" stroke="#16232E" stroke-width="1.5"/>
          <polygon points="20,5 25.5,25 20,20.5 14.5,25" fill="#16232E"/>
          <text x="20" y="34.5" font-size="9.5" text-anchor="middle" fill="#16232E" font-weight="700">N</text>
        </svg>
      </div>
      <div class="issue-list" id="issueList"></div>
    </div>
  </div>
</div>

<script>
const SIDES = ["N","E","S","W"];
let idCounter = 1;
const newId = () => idCounter++;
let selectedPipeId = null;
let zoomScale = 1, panX = 0, panY = 0;
let lastVB = null, lastFitVB = null;

function defaultPit(name){
  return {
    id:newId(), name:name||"Pit 01", width:600, length:600, wallThk:75, cornerClear:150, spacing:150,
    defaultPipeWT:20, coverType:"closed", grateW:600, grateH:600,
    pipes:[
      { id:newId(), label:"Inlet 1", side:"N", diameter:300, angle:0, mode:"auto", offset:0, type:"inlet",
        flowReversed:false, wtMode:"default", wallThk:20, collapsed:true, multi:false, count:2, spacingMode:"default", spacing:150 },
      { id:newId(), label:"Outlet", side:"S", diameter:375, angle:0, mode:"auto", offset:0, type:"outlet",
        flowReversed:false, wtMode:"default", wallThk:20, collapsed:true, multi:false, count:2, spacingMode:"default", spacing:150 }
    ]
  };
}
let state = { projectName:"Project 01", pits:[ defaultPit("Pit 01") ], activePitId:null };
state.activePitId = state.pits[0].id;

// ---------- IndexedDB persistence ----------
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open("PitCheckerDB", 1);
    req.onupgradeneeded = e => { e.target.result.createObjectStore("kv"); };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e);
  });
}
function saveState(){
  if(!db) return;
  try{
    const tx = db.transaction("kv","readwrite");
    tx.objectStore("kv").put(JSON.parse(JSON.stringify(state)), "appState");
    document.getElementById("saveNote").textContent = "Saved " + new Date().toLocaleTimeString();
  }catch(err){ console.error("Save failed", err); }
}
let saveTimer=null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveState, 400); }
function loadState(){
  return new Promise((resolve)=>{
    if(!db) return resolve(null);
    const tx = db.transaction("kv","readonly");
    const req = tx.objectStore("kv").get("appState");
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}
function getActivePit(){ return state.pits.find(p=>p.id===state.activePitId); }

// ---------- SVG helpers ----------
function el(tag, attrs, children){
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(children) children.forEach(c => e.appendChild(c));
  return e;
}
function px2u(px){
  const rect = document.getElementById("svgFrame").getBoundingClientRect();
  const w = (lastFitVB ? lastFitVB.w/zoomScale : 1000);
  return px * (w / Math.max(1,rect.width));
}
function text(x,y,strPx,str,opts={}){
  const t = el("text", Object.assign({x,y,"font-size":px2u(strPx),fill:opts.fill||"var(--line-muted)","font-family":"'Segoe UI',sans-serif","text-anchor":opts.anchor||"middle","font-weight":opts.weight||"400"},opts.attrs||{}));
  t.textContent = str;
  return t;
}

// ---------- Pit list ----------
function resetView(){ zoomScale=1; panX=0; panY=0; }
function renderPitList(){
  const list = document.getElementById("pitList");
  list.innerHTML = "";
  state.pits.forEach(pit=>{
    const row = document.createElement("div");
    row.className = "pit-item" + (pit.id===state.activePitId ? " active":"");
    row.innerHTML = `
      <span>${pit.name}</span>
      <span class="pit-actions">
        <button class="icon-btn" data-act="dup" data-id="${pit.id}" title="Duplicate">⧉</button>
        <button class="icon-btn danger" data-act="del" data-id="${pit.id}" title="Delete">✕</button>
      </span>`;
    row.addEventListener("click", (e)=>{
      if(e.target.closest("button")) return;
      state.activePitId = pit.id; selectedPipeId = null; resetView();
      renderAll();
    });
    list.appendChild(row);
  });
  list.querySelectorAll("[data-act]").forEach(btn=>{
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      const id = parseInt(btn.dataset.id);
      if(btn.dataset.act==="del"){
        if(state.pits.length===1){ alert("A project needs at least one pit."); return; }
        state.pits = state.pits.filter(p=>p.id!==id);
        if(state.activePitId===id) state.activePitId = state.pits[0].id;
      } else if(btn.dataset.act==="dup"){
        const src = state.pits.find(p=>p.id===id);
        const copy = JSON.parse(JSON.stringify(src));
        copy.id = newId(); copy.name = src.name + " copy";
        copy.pipes.forEach(p=>p.id=newId());
        state.pits.push(copy); state.activePitId = copy.id;
      }
      selectedPipeId = null; resetView();
      renderAll(); scheduleSave();
    });
  });
}
document.getElementById("addPitBtn").addEventListener("click", ()=>{
  const p = defaultPit("Pit " + String(state.pits.length+1).padStart(2,"0"));
  state.pits.push(p); state.activePitId = p.id; selectedPipeId=null; resetView();
  renderAll(); scheduleSave();
});

// ---------- Pit settings ----------
function renderPitSettings(){
  const pit = getActivePit();
  document.getElementById("pitName").value = pit.name;
  document.getElementById("pitWidth").value = pit.width;
  document.getElementById("pitLength").value = pit.length;
  document.getElementById("wallThk").value = pit.wallThk;
  document.getElementById("cornerClear").value = pit.cornerClear;
  document.getElementById("pipeSpacing").value = pit.spacing;
  document.getElementById("defaultPipeWT").value = pit.defaultPipeWT;
  document.getElementById("coverType").value = pit.coverType;
  document.getElementById("grateW").value = pit.grateW;
  document.getElementById("grateH").value = pit.grateH;
  document.getElementById("grateFields").style.display = pit.coverType==="grated" ? "flex" : "none";
}
[["pitName","name",false],["pitWidth","width",true],["pitLength","length",true],
 ["wallThk","wallThk",true],["cornerClear","cornerClear",true],["pipeSpacing","spacing",true],
 ["defaultPipeWT","defaultPipeWT",true],["coverType","coverType",false],
 ["grateW","grateW",true],["grateH","grateH",true]
].forEach(([elId,field,isNum])=>{
  document.getElementById(elId).addEventListener("input", e=>{
    const pit = getActivePit();
    pit[field] = isNum ? (parseFloat(e.target.value)||0) : e.target.value;
    if(field==="name") renderPitList();
    if(field==="coverType") document.getElementById("grateFields").style.display = pit.coverType==="grated" ? "flex" : "none";
    renderScene(); scheduleSave();
  });
});

// ---------- Pipe list ----------
function pipeWT(pit,p){ return p.wtMode==="manual" ? p.wallThk : pit.defaultPipeWT; }

function renderPipeCards(){
  const pit = getActivePit();
  const list = document.getElementById("pipeList");
  const chipWrap = document.getElementById("filterChipWrap");
  document.getElementById("pipeCountLabel").textContent = `(${pit.pipes.length})`;
  list.innerHTML = "";

  let pipesToShow = pit.pipes;
  chipWrap.innerHTML = "";
  if(selectedPipeId && pit.pipes.some(p=>p.id===selectedPipeId)){
    const sel = pit.pipes.find(p=>p.id===selectedPipeId);
    pipesToShow = [sel];
    chipWrap.innerHTML = `<div class="filter-chip"><span>Editing: ${sel.label}</span><button id="clearFilterBtn">Show all pipes ✕</button></div>`;
  }

  pipesToShow.forEach((p)=>{
    const idx = pit.pipes.indexOf(p);
    const isOpen = selectedPipeId===p.id ? true : !p.collapsed;
    const card = document.createElement("div");
    card.className = "pipe-card";
    const autoDisplay = p.mode==="auto"
      ? `<div class="auto-offset-display">Auto-centred: ${Math.round(p._autoOffsetFromCentre||0)}mm from wall centre</div>`
      : `<div class="field"><label>Offset from wall centre (mm) — + = East/South</label><input type="number" data-field="offset" data-id="${p.id}" value="${p.offset}" step="10"></div>`;
    const wtDisplay = p.wtMode==="manual"
      ? `<div class="field"><label>Pipe wall thickness (mm)</label><input type="number" data-field="wallThk" data-id="${p.id}" value="${p.wallThk}" step="1"></div>`
      : `<div class="auto-offset-display">Using default wall thk: ${pit.defaultPipeWT}mm</div>`;
    const multiBlock = p.multi ? `
        <div class="field-row">
          <div class="field"><label>Number of pipes</label><input type="number" data-field="count" data-id="${p.id}" value="${p.count||2}" min="2" step="1"></div>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="spc-${p.id}" data-field="spacingMode" data-id="${p.id}" ${p.spacingMode==="manual"?"checked":""}>
          <label for="spc-${p.id}" style="margin:0;">Override clear spacing within this group</label>
        </div>
        ${p.spacingMode==="manual"
          ? `<div class="field"><label>Clear spacing, OD to OD (mm)</label><input type="number" data-field="spacing" data-id="${p.id}" value="${p.spacing||pit.spacing}" step="10"></div>`
          : `<div class="auto-offset-display">Using default clear spacing: ${pit.spacing}mm</div>`}
        <div class="subnote">All pipes in this group currently share size &amp; skew — per-pipe sizing is planned for later.</div>
      ` : "";
    card.innerHTML = `
      <div class="pipe-head" data-toggle="${p.id}">
        <span class="htext"><span class="chevron">${isOpen?"▾":"▸"}</span><b>${p.label}${p.multi?` (×${p.count||2})`:""}</b></span>
        <span class="meta">${p.side} · ⌀${p.diameter}</span>
        <span class="reorder-btns">
          <button class="icon-btn" data-act="up" data-id="${p.id}" ${idx===0?"disabled":""}>▲</button>
          <button class="icon-btn" data-act="down" data-id="${p.id}" ${idx===pit.pipes.length-1?"disabled":""}>▼</button>
        </span>
        <button class="remove-btn" data-act="remove" data-id="${p.id}">✕</button>
      </div>
      <div class="pipe-body" style="${isOpen?"":"display:none;"}">
        <div class="field"><label>Label</label><input type="text" data-field="label" data-id="${p.id}" value="${p.label}"></div>
        <div class="field-row">
          <div class="field"><label>Type</label>
            <select data-field="type" data-id="${p.id}">
              <option value="inlet" ${p.type==="inlet"?"selected":""}>Inlet</option>
              <option value="outlet" ${p.type==="outlet"?"selected":""}>Outlet</option>
            </select>
          </div>
          <div class="field"><label>Wall</label>
            <select data-field="side" data-id="${p.id}">
              ${SIDES.map(s=>`<option value="${s}" ${s===p.side?"selected":""}>${s}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>OD (mm)</label><input type="number" data-field="diameter" data-id="${p.id}" value="${p.diameter}" step="15"></div>
          <div class="field"><label>Skew angle (°)</label><input type="number" data-field="angle" data-id="${p.id}" value="${p.angle}" step="5" min="-60" max="60"></div>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="multi-${p.id}" data-field="multi" data-id="${p.id}" ${p.multi?"checked":""}>
          <label for="multi-${p.id}" style="margin:0;">Multiple pipes on this wall (same size for now)</label>
        </div>
        ${multiBlock}
        <div class="checkbox-row">
          <input type="checkbox" id="manual-${p.id}" data-field="mode" data-id="${p.id}" ${p.mode==="manual"?"checked":""}>
          <label for="manual-${p.id}" style="margin:0;">Manually set offset</label>
        </div>
        ${autoDisplay}
        <div class="checkbox-row">
          <input type="checkbox" id="wt-${p.id}" data-field="wtMode" data-id="${p.id}" ${p.wtMode==="manual"?"checked":""}>
          <label for="wt-${p.id}" style="margin:0;">Override pipe wall thickness</label>
        </div>
        ${wtDisplay}
        <div class="checkbox-row">
          <input type="checkbox" id="flow-${p.id}" data-field="flowReversed" data-id="${p.id}" ${p.flowReversed?"checked":""}>
          <label for="flow-${p.id}" style="margin:0;">Reverse flow arrow (default: ${p.type==="inlet"?"into pit":"out of pit"})</label>
        </div>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll("[data-toggle]").forEach(head=>{
    head.addEventListener("click", ()=>{
      const id = parseInt(head.dataset.toggle);
      if(selectedPipeId===id) return;
      const pipe = pit.pipes.find(p=>p.id===id);
      pipe.collapsed = !pipe.collapsed;
      renderPipeCards(); scheduleSave();
    });
  });
  list.querySelectorAll("input[type=text],input[type=number],select").forEach(inp=>{
    inp.addEventListener("click", e=>e.stopPropagation());
    inp.addEventListener("input", e=>{
      const id = parseInt(e.target.dataset.id);
      const field = e.target.dataset.field;
      const pipe = pit.pipes.find(p=>p.id===id);
      if(!pipe) return;
      pipe[field] = (field==="label"||field==="side"||field==="type") ? e.target.value : parseFloat(e.target.value)||0;
      if(field==="count") pipe.count = Math.max(2, Math.round(pipe.count));
      renderScene(); scheduleSave();
    });
  });
  list.querySelectorAll("input[type=checkbox]").forEach(cb=>{
    cb.addEventListener("click", e=>e.stopPropagation());
    cb.addEventListener("change", e=>{
      const id = parseInt(e.target.dataset.id);
      const field = e.target.dataset.field;
      const pipe = pit.pipes.find(p=>p.id===id);
      if(!pipe) return;
      if(field==="mode"){
        pipe.mode = e.target.checked ? "manual" : "auto";
        if(pipe.mode==="manual") pipe.offset = pipe._autoOffsetFromCentre || 0;
      } else if(field==="wtMode"){
        pipe.wtMode = e.target.checked ? "manual" : "default";
        if(pipe.wtMode==="manual") pipe.wallThk = pipe.wallThk || pit.defaultPipeWT;
      } else if(field==="flowReversed"){
        pipe.flowReversed = e.target.checked;
      } else if(field==="multi"){
        pipe.multi = e.target.checked;
        if(pipe.multi && !pipe.count) pipe.count = 2;
      } else if(field==="spacingMode"){
        pipe.spacingMode = e.target.checked ? "manual" : "default";
        if(pipe.spacingMode==="manual") pipe.spacing = pipe.spacing || pit.spacing;
      }
      renderPipeCards(); renderScene(); scheduleSave();
    });
  });
  list.querySelectorAll("[data-act]").forEach(btn=>{
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      const id = parseInt(btn.dataset.id);
      const act = btn.dataset.act;
      const idx = pit.pipes.findIndex(p=>p.id===id);
      if(act==="remove"){ pit.pipes.splice(idx,1); if(selectedPipeId===id) selectedPipeId=null; }
      if(act==="up" && idx>0){ [pit.pipes[idx-1],pit.pipes[idx]]=[pit.pipes[idx],pit.pipes[idx-1]]; }
      if(act==="down" && idx<pit.pipes.length-1){ [pit.pipes[idx+1],pit.pipes[idx]]=[pit.pipes[idx],pit.pipes[idx+1]]; }
      renderPipeCards(); renderScene(); scheduleSave();
    });
  });
  const clearBtn = document.getElementById("clearFilterBtn");
  if(clearBtn) clearBtn.addEventListener("click", ()=>{ selectedPipeId=null; renderPipeCards(); });
}

    offset:0, type:"inlet", flowReversed:false, wtMode:"default", wallThk:pit.defaultPipeWT, collapsed:false,

// ---------- Zoom ----------
const svgFrameEl = document.getElementById("svgFrame");
function clampZ(v){ return Math.max(0.5, Math.min(4, v)); }
function applyZoom(factor, clientX, clientY){
  if(lastVB && lastFitVB){
    const rect = svgFrameEl.getBoundingClientRect();
    const relX = (clientX-rect.left)/rect.width, relY = (clientY-rect.top)/rect.height;
    const pxUser = lastVB.x + relX*lastVB.w, pyUser = lastVB.y + relY*lastVB.h;
    zoomScale = clampZ(zoomScale*factor);
    const newW = lastFitVB.w/zoomScale, newH = lastFitVB.h/zoomScale;
    const newX = pxUser - relX*newW, newY = pyUser - relY*newH;
    panX = newX - (lastFitVB.w-newW)/2;
    panY = newY - (lastFitVB.h-newH)/2;
  } else {
    zoomScale = clampZ(zoomScale*factor);
  }
  renderScene();
}
svgFrameEl.addEventListener("wheel", e=>{
  e.preventDefault();
  applyZoom(e.deltaY<0 ? 1.12 : 1/1.12, e.clientX, e.clientY);
},{passive:false});
let pinchStartDist=null, pinchStartScale=1, pinchMid=null;
function touchDist(t1,t2){ return Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY); }
svgFrameEl.addEventListener("touchstart", e=>{
  if(e.touches.length===2){
    pinchStartDist = touchDist(e.touches[0],e.touches[1]);
    pinchStartScale = zoomScale;
    pinchMid = {x:(e.touches[0].clientX+e.touches[1].clientX)/2, y:(e.touches[0].clientY+e.touches[1].clientY)/2};
  }
},{passive:true});
svgFrameEl.addEventListener("touchmove", e=>{
  if(e.touches.length===2 && pinchStartDist){
    e.preventDefault();
    const d = touchDist(e.touches[0],e.touches[1]);
    const targetScale = clampZ(pinchStartScale*(d/pinchStartDist));
    applyZoom(targetScale/zoomScale, pinchMid.x, pinchMid.y);
  }
},{passive:false});
svgFrameEl.addEventListener("touchend", e=>{ if(e.touches.length<2) pinchStartDist=null; });
svgFrameEl.addEventListener("dblclick", ()=>{ resetView(); renderScene(); });
document.getElementById("zoomIn").addEventListener("click", ()=>{
  const r=svgFrameEl.getBoundingClientRect(); applyZoom(1.25, r.left+r.width/2, r.top+r.height/2);
});
document.getElementById("zoomOut").addEventListener("click", ()=>{
  const r=svgFrameEl.getBoundingClientRect(); applyZoom(0.8, r.left+r.width/2, r.top+r.height/2);
});
document.getElementById("zoomReset").addEventListener("click", ()=>{ resetView(); renderScene(); });

// ---------- Layout: groups (edge-to-edge spacing), auto positions, checks ----------
function wallLenFor(pit, side){ return (side==="N"||side==="S") ? pit.width : pit.length; }

function computeAutoPositions(pit){
  SIDES.forEach(side=>{
    const wallLen = wallLenFor(pit, side);
    const entries = pit.pipes.filter(p=>p.side===side);
    const gapDefault = pit.spacing || 150;
    entries.forEach(p=>{
      const n = p.multi ? Math.max(2, p.count||2) : 1;
      const g = (p.multi && p.spacingMode==="manual") ? (p.spacing||gapDefault) : gapDefault;
      const d = p.diameter;
      p._groupGapUsed = g;
      p._internalSpan = n*d + (n-1)*g; // OD-edge to OD-edge extent of the whole group
    });
    const autoEntries = entries.filter(p=>p.mode==="auto");
    const blockGap = gapDefault;
    const totalBlockSpan = autoEntries.reduce((s,p)=>s+p._internalSpan,0) + blockGap*Math.max(0,autoEntries.length-1);
    let cursor = wallLen/2 - totalBlockSpan/2;
    autoEntries.forEach(p=>{
      p._blockStart = cursor;
      p._autoOffsetFromCentre = (cursor + p._internalSpan/2) - wallLen/2;
      cursor += p._internalSpan + blockGap;
    });
  });
}
function blockStart(pit,p){
  if(p.mode==="auto") return p._blockStart;
  return wallLenFor(pit,p.side)/2 + p.offset - p._internalSpan/2;
}
function expandGroup(pit,p){
  const start = blockStart(pit,p);
  const n = p.multi ? Math.max(2,p.count||2) : 1;
  const d = p.diameter, g = p._groupGapUsed || pit.spacing || 150;
  const out=[];
  for(let i=0;i<n;i++){
    const centerFromCorner = start + d/2 + i*(d+g);
    out.push({ parentId:p.id, side:p.side, diameter:d, angle:p.angle, type:p.type, flowReversed:p.flowReversed,
      wt:pipeWT(pit,p), offsetFromCorner:centerFromCorner, label: n>1?`${p.label} #${i+1}`:p.label });
  }
  return out;
}
function allInstances(pit){
  let out=[];
  pit.pipes.forEach(p => out = out.concat(expandGroup(pit,p)));
  return out;
}
function checkInstance(pit, inst){
  const issues = [];
  const wallLen = wallLenFor(pit, inst.side);
  const skewFactor = 1/Math.cos(inst.angle*Math.PI/180);
  const footprint = inst.diameter * Math.abs(skewFactor);
  const clear = pit.cornerClear;
  const startPos = inst.offsetFromCorner - footprint/2;
  const endPos = inst.offsetFromCorner + footprint/2;
  if(startPos < clear) issues.push(`${inst.label}: only ${Math.max(0,Math.round(startPos))}mm to near corner — needs ${clear}mm`);
  if(wallLen - endPos < clear) issues.push(`${inst.label}: only ${Math.max(0,Math.round(wallLen-endPos))}mm to far corner — needs ${clear}mm`);
  if(footprint > wallLen - 2*clear && wallLen - 2*clear > 0) issues.push(`${inst.label}: skewed footprint (${Math.round(footprint)}mm) doesn't fit between corner clearances`);
  if(startPos < 0 || endPos > wallLen) issues.push(`${inst.label}: extends beyond the wall — reduce spacing or offset`);
  return issues;
}

// ---------- Dimension lines ----------
function dimHorizontal(svg, y, points, dir){
  for(let i=0;i<points.length-1;i++){
    const x1=points[i], x2=points[i+1], len=x2-x1;
    if(len<=1) continue;
    svg.appendChild(el("line",{x1,y1:y,x2,y2:y+dir*6,stroke:"var(--line-muted)","stroke-width":1}));
    svg.appendChild(el("line",{x1:x2,y1:y,x2:x2,y2:y+dir*6,stroke:"var(--line-muted)","stroke-width":1}));
    svg.appendChild(el("line",{x1,y1:y,x2:x2,y2:y,stroke:"var(--line-muted)","stroke-width":0.75}));
    if(len>26) svg.appendChild(text((x1+x2)/2, y+dir*15, 9.5, Math.round(len)+"", {fill:"var(--line-muted)"}));
  }
}
function dimVertical(svg, x, points, dir){
  for(let i=0;i<points.length-1;i++){
    const y1=points[i], y2=points[i+1], len=y2-y1;
    if(len<=1) continue;
    svg.appendChild(el("line",{x1:x,y1,x2:x+dir*6,y2:y1,stroke:"var(--line-muted)","stroke-width":1}));
    svg.appendChild(el("line",{x1:x,y1:y2,x2:x+dir*6,y2:y2,stroke:"var(--line-muted)","stroke-width":1}));
    svg.appendChild(el("line",{x1:x,y1,x2:x,y2:y2,stroke:"var(--line-muted)","stroke-width":0.75}));
    if(len>26){
      const t = text(x+dir*15,(y1+y2)/2, 9.5, Math.round(len)+"", {fill:"var(--line-muted)"});
      t.setAttribute("transform",`rotate(-90 ${x+dir*15} ${(y1+y2)/2})`);
      svg.appendChild(t);
    }
  }
}
function buildWallPoints(pit, side, instances){
  const wallLen = wallLenFor(pit, side);
  const pts = [0];
  instances.filter(p=>p.side===side).sort((a,b)=>a.offsetFromCorner-b.offsetFromCorner).forEach(p=>{
    const skewFactor = 1/Math.cos(p.angle*Math.PI/180);
    const r = Math.abs(skewFactor)*p.diameter/2;
    pts.push(p.offsetFromCorner-r, p.offsetFromCorner+r);
  });
  pts.push(wallLen);
  return pts.filter((v,i,a)=> i===0 || v>a[i-1]+0.5);
}

// ---------- Render ----------
function renderScene(){
  const pit = getActivePit();
  computeAutoPositions(pit);
  const instances = allInstances(pit);

  let allIssues = [];
  instances.forEach(inst => { allIssues = allIssues.concat(checkInstance(pit, inst)); });

  const banner = document.getElementById("statusBanner");
  const issueBox = document.getElementById("issueList");
  if(allIssues.length===0){
    banner.className = "status-banner pass";
    banner.innerHTML = `<span class="status-dot"></span> ${pit.name}: all pipes clear corner and wall constraints`;
    issueBox.innerHTML = "";
  } else {
    banner.className = "status-banner fail";
    banner.innerHTML = `<span class="status-dot"></span> ${pit.name}: ${allIssues.length} clearance issue${allIssues.length>1?"s":""} found`;
    issueBox.innerHTML = allIssues.map(i=>`<div class="issue">${i}</div>`).join("");
  }

  const svg = document.getElementById("pitSvg");
  svg.innerHTML = "";
  const EXT_STUB = 500; // mm outside pit
  const pad = EXT_STUB + 220;
  const outerW = pit.width + pit.wallThk*2, outerL = pit.length + pit.wallThk*2;
  const fitW = outerW + pad*2, fitH = outerL + pad*2;
  lastFitVB = {w:fitW, h:fitH};
  const curW = fitW/zoomScale, curH = fitH/zoomScale;
  const curX = (fitW-curW)/2 + panX, curY = (fitH-curH)/2 + panY;
  lastVB = {x:curX,y:curY,w:curW,h:curH};
  svg.setAttribute("viewBox", `${curX} ${curY} ${curW} ${curH}`);

  const ox = pad, oy = pad, ix = ox+pit.wallThk, iy = oy+pit.wallThk;

  const outerRect = el("rect",{x:ox,y:oy,width:outerW,height:outerL,fill:"var(--wall-fill)",stroke:"var(--wall)","stroke-width":2,style:"cursor:pointer;"});
  outerRect.addEventListener("click", ()=>{ selectedPipeId=null; renderPipeCards(); document.getElementById("panel").classList.remove("hidden"); document.getElementById("toggleBtn").textContent="Hide inputs"; });
  svg.appendChild(outerRect);
  svg.appendChild(el("rect",{x:ix,y:iy,width:pit.width,height:pit.length,fill:"var(--paper)",stroke:"var(--wall)","stroke-width":1.5}));
  svg.appendChild(text(ox+outerW/2, oy-24, 13, `${pit.name} — internal ${pit.width} × ${pit.length}mm, wall ${pit.wallThk}mm`, {fill:"var(--ink)", weight:"700"}));

  // setout cross for closed-cover pits (matches reference drawing convention)
  if(pit.coverType==="closed"){
    svg.appendChild(el("line",{x1:ix,y1:iy,x2:ix+pit.width,y2:iy+pit.length,stroke:"var(--line-muted)","stroke-width":0.75,"stroke-dasharray":"5,4",opacity:0.55}));
    svg.appendChild(el("line",{x1:ix+pit.width,y1:iy,x2:ix,y2:iy+pit.length,stroke:"var(--line-muted)","stroke-width":0.75,"stroke-dasharray":"5,4",opacity:0.55}));
  } else {
    const gw = pit.grateW||600, gh = pit.grateH||600;
    const coverW = Math.min(gw, pit.width), coverH = Math.min(gh, pit.length);
    const haunched = coverW < pit.width || coverH < pit.length;
    const gx = ix + (pit.width-coverW)/2, gy = iy + (pit.length-coverH)/2;
    if(haunched){
      const pc = [[ix,iy],[ix+pit.width,iy],[ix+pit.width,iy+pit.length],[ix,iy+pit.length]];
      const gc = [[gx,gy],[gx+coverW,gy],[gx+coverW,gy+coverH],[gx,gy+coverH]];
      pc.forEach((c,i)=>{
        svg.appendChild(el("line",{x1:c[0],y1:c[1],x2:gc[i][0],y2:gc[i][1],stroke:"var(--line-muted)","stroke-width":1,"stroke-dasharray":"4,3"}));
      });
      svg.appendChild(text(ix+pit.width/2, gy-10, 10.5, `HAUNCHED TO ${coverW}×${coverH}`, {fill:"var(--line-muted)"}));
    }
    svg.appendChild(el("rect",{x:gx,y:gy,width:coverW,height:coverH, fill:"none", stroke:"var(--ink)","stroke-width":1.6}));
    const hatchGap=40;
    for(let hx=gx+hatchGap/2; hx<gx+coverW; hx+=hatchGap){
      svg.appendChild(el("line",{x1:hx,y1:gy,x2:hx,y2:gy+coverH,stroke:"var(--line-muted)","stroke-width":0.75}));
    }
  }

  const hasPipesOn = side => pit.pipes.some(p=>p.side===side);
  const dimGap = side => hasPipesOn(side) ? (pit.wallThk/2 + EXT_STUB + 40) : 30;
  dimHorizontal(svg, oy-dimGap("N"), buildWallPoints(pit,"N",instances).map(v=>ix+v), -1);
  dimHorizontal(svg, oy+outerL+dimGap("S"), buildWallPoints(pit,"S",instances).map(v=>ix+v), 1);
  dimVertical(svg, ox-dimGap("W"), buildWallPoints(pit,"W",instances).map(v=>iy+v), -1);
  dimVertical(svg, ox+outerW+dimGap("E"), buildWallPoints(pit,"E",instances).map(v=>iy+v), 1);

  instances.forEach(inst=>{
    const isFail = checkInstance(pit, inst).length>0;
    const color = isFail ? "var(--pipe-fail)" : "var(--pipe)";
    const rOD = inst.diameter/2;
    let cx, cy, rot=0;
    if(inst.side==="N"){ cx=ix+inst.offsetFromCorner; cy=oy+pit.wallThk/2; rot=0; }
    if(inst.side==="S"){ cx=ix+inst.offsetFromCorner; cy=oy+outerL-pit.wallThk/2; rot=180; }
    if(inst.side==="W"){ cx=ox+pit.wallThk/2; cy=iy+inst.offsetFromCorner; rot=270; }
    if(inst.side==="E"){ cx=ox+outerW-pit.wallThk/2; cy=iy+inst.offsetFromCorner; rot=90; }

    const interiorReach = Math.min(350, Math.min(pit.width,pit.length)*0.4);
    const interiorHalf = pit.wallThk/2 + interiorReach; // reaches to / past inner wall
    const exteriorHalf = pit.wallThk/2 + EXT_STUB;

    const g = el("g",{transform:`rotate(${rot+inst.angle} ${cx} ${cy})`, style:"cursor:pointer;"});
    g.addEventListener("click", (e)=>{
      e.stopPropagation();
      selectedPipeId = inst.parentId;
      renderPipeCards();
      document.getElementById("panel").classList.remove("hidden");
      document.getElementById("toggleBtn").textContent="Hide inputs";
    });
    // plan-view pipe: outer diameter width only, extending to inner wall and 500mm outside
    g.appendChild(el("rect",{x:cx-rOD, y:cy-exteriorHalf, width:rOD*2, height:exteriorHalf+interiorHalf, fill:color, opacity:0.14, stroke:color,"stroke-width":1.4}));
    // break/continuation ticks at the outer (exterior) end
    const by = cy-exteriorHalf;
    g.appendChild(el("line",{x1:cx-rOD-5,y1:by+9,x2:cx-rOD+5,y2:by-1,stroke:color,"stroke-width":1.2}));
    g.appendChild(el("line",{x1:cx+rOD-5,y1:by+9,x2:cx+rOD+5,y2:by-1,stroke:color,"stroke-width":1.2}));

    let intoPit = inst.type==="inlet";
    if(inst.flowReversed) intoPit = !intoPit;
    const dir = intoPit ? 1 : -1;
    const arrowReach = pit.wallThk*1.6;
    const a1 = cy + dir*(arrowReach*0.4), a2 = cy + dir*(arrowReach*0.95);
    g.appendChild(el("line",{x1:cx,y1:a1,x2:cx,y2:a2,stroke:color,"stroke-width":2}));
    const headLen=9, headW=6, tipY=a2, backY=a2-dir*headLen;
    g.appendChild(el("polygon",{points:`${cx},${tipY} ${cx-headW},${backY} ${cx+headW},${backY}`, fill:color}));

    if(selectedPipeId===inst.parentId){
      g.appendChild(el("rect",{x:cx-rOD-6, y:cy-exteriorHalf-6, width:rOD*2+12, height:exteriorHalf+interiorHalf+12, fill:"none", stroke:"var(--accent)","stroke-width":2,"stroke-dasharray":"4,3"}));
    }
    svg.appendChild(g);

    const labelGap = pit.wallThk*1.9 + 16;
    const lx = inst.side==="W" ? cx-labelGap : inst.side==="E" ? cx+labelGap : cx;
    const ly = inst.side==="N" ? cy-labelGap : inst.side==="S" ? cy+labelGap : cy;
    const anchor = inst.side==="W" ? "end" : inst.side==="E" ? "start" : "middle";
    svg.appendChild(text(lx,ly,12,`${inst.label} ⌀${inst.diameter}`,{fill:isFail?"var(--fail)":"var(--ink)", anchor, weight:"600"}));
  });

  const clearColor = "#B0761F";
  SIDES.forEach(side=>{
    const wallLen = wallLenFor(pit, side);
    if(side==="N"||side==="S"){
      const y = side==="N" ? oy : oy+outerL;
      [ix+pit.cornerClear, ix+wallLen-pit.cornerClear].forEach(x=>{
        svg.appendChild(el("line",{x1:x,y1:y-pit.wallThk*0.6,x2:x,y2:y+pit.wallThk*0.6,stroke:clearColor,"stroke-width":1.5,"stroke-dasharray":"3,2"}));
      });
    } else {
      const x = side==="W" ? ox : ox+outerW;
      [iy+pit.cornerClear, iy+wallLen-pit.cornerClear].forEach(y=>{
        svg.appendChild(el("line",{x1:x-pit.wallThk*0.6,y1:y,x2:x+pit.wallThk*0.6,y2:y,stroke:clearColor,"stroke-width":1.5,"stroke-dasharray":"3,2"}));
      });
    }
  });
}

function renderAll(){ renderPitList(); renderPitSettings(); renderPipeCards(); renderScene(); }

// ---------- Boot ----------
(async function boot(){
  try{
    db = await openDB();
    const saved = await loadState();
    if(saved && saved.pits && saved.pits.length){
      state = saved;
      state.pits.forEach(pit=>{
        if(pit.defaultPipeWT===undefined) pit.defaultPipeWT=20;
        if(pit.coverType===undefined) pit.coverType="closed";
        if(pit.grateW===undefined) pit.grateW=600;
        if(pit.grateH===undefined) pit.grateH=600;
        pit.pipes.forEach(p=>{
          if(p.type===undefined) p.type = "inlet";
          if(p.flowReversed===undefined) p.flowReversed=false;
          if(p.wtMode===undefined) p.wtMode="default";
          if(p.wallThk===undefined) p.wallThk=pit.defaultPipeWT;
          if(p.collapsed===undefined) p.collapsed=true;
          if(p.multi===undefined) p.multi=false;
          if(p.count===undefined) p.count=2;
          if(p.spacingMode===undefined) p.spacingMode="default";
          if(p.spacing===undefined) p.spacing=pit.spacing;
        });
      });
      const maxId = Math.max(1, ...state.pits.flatMap(p=>[p.id, ...p.pipes.map(pp=>pp.id)]));
      idCounter = maxId+1;
      document.getElementById("projectName").value = state.projectName || "Project 01";
    }
  }catch(err){
    console.error("IndexedDB unavailable, running without persistence", err);
    document.getElementById("saveNote").textContent = "Local saving unavailable in this browser";
  }
  renderAll();
})();
</script>
</body>
</html>
